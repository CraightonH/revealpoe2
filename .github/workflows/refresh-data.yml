name: Refresh game data

# The ONLY workflow that hits GGG / RePoE in bulk. It re-scrapes RePoE game data
# (scrape.py) and re-fetches GGG's passive tree + sprite atlases (fetch:tree) —
# both are unconditional full mirrors — then does a FULL build, deploys, and
# uploads the refreshed build cache to R2 for deploy.yml's fast path to reuse.
#
# Run it manually after a game patch (Actions ▸ Refresh game data ▸ Run), or let
# the weekly schedule catch patches nobody triggered. It never runs on push —
# code changes take deploy.yml's cached path and never touch third parties.

on:
  workflow_dispatch:
    inputs:
      force_images:
        description: "Re-pull ALL art (build:images --force), not just genuinely-new"
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC

concurrency:
  group: refresh-data
  cancel-in-progress: false

env:
  CACHE_KEY: cache.tar.zst
  R2_BUCKET: revealpoe2-cache
  SITE_URL: https://revealpoe2.com
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: npm ci

      # Restore the prior cache so build:images only fetches genuinely-new art
      # (a warm public/img means its per-file gate trusts existing files).
      # Best-effort: a missing cache (very first run) just means a full art pull.
      - name: Restore prior cache (best effort)
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -uo pipefail
          if aws s3 cp "s3://${R2_BUCKET}/${CACHE_KEY}" "${CACHE_KEY}" --endpoint-url "$R2_ENDPOINT"; then
            tar --zstd -xf "${CACHE_KEY}" && rm -f "${CACHE_KEY}"
          else
            echo "No prior cache — this run will fetch everything (expected on first run)."
          fi

      - name: Scrape RePoE game data
        run: python scripts/scrape.py

      - name: Fetch GGG passive tree + atlases
        run: npm run fetch:tree

      # League list for the header's patch/league badge — captured here, with the
      # data it labels, and never on the cached deploy path. Warns (never fails)
      # if GGG is unreachable; the previous leagues.json in the cache is kept.
      - name: Fetch GGG league list
        run: npm run fetch:leagues

      - name: Build static site (full)
        run: |
          set -euo pipefail
          npm run build:graph
          npm run build:index
          # build:passives writes public/generated/passive-tree.json, whose
          # meta.instillIcons tells build:images which Distilled Emotion icons to
          # self-host — so it MUST run first (public/generated is gitignored and
          # not in the R2 cache, so the file is absent until this step recreates it).
          npm run build:passives
          if [ "${{ inputs.force_images }}" = "true" ]; then
            npm run build:images -- --force
          else
            npm run build:images
          fi
          npm run build:og
          node scripts/prerender.js

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --branch main

      - name: Upload refreshed cache to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          tar --zstd -cf "${CACHE_KEY}" data/source public/img public/og
          aws s3 cp "${CACHE_KEY}" "s3://${R2_BUCKET}/${CACHE_KEY}" --endpoint-url "$R2_ENDPOINT"

  # DISABLED 2026-09-07. This job reseeded the entire graph into D1 on every
  # refresh — ~253k rows in a single bulk write, 2.5x the D1 free-tier cap of
  # 100k rows/day, which tripped quota alerts on every weekly run. The MCP
  # server it feeds (revealpoe2-mcp) is unused, so the reseed stays off until
  # the integration is reworked — see docs/TODO.md. Drop the `if:` to re-enable.
  #
  # Separate job so a D1 failure never fails the site refresh above. This is
  # the ONLY place that reseeds D1 — never do it from deploy.yml (code-only).
  seed-mcp:
    if: false
    needs: refresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore build cache from R2 (just refreshed by the refresh job)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          aws s3 cp "s3://${R2_BUCKET}/${CACHE_KEY}" "${CACHE_KEY}" --endpoint-url "$R2_ENDPOINT"
          tar --zstd -xf "${CACHE_KEY}"
          rm -f "${CACHE_KEY}"

      - name: Build the seed
        run: |
          npm run build:graph
          npm run build:passives
          npm run build:mcp-sql

      - name: Reseed D1 + assert hash parity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute revealpoe2-graph --remote -y --config workers/mcp/wrangler.jsonc --file build/mcp.sql
          node scripts/check-mcp-seed.js
