name: TEST r2 creds (throwaway)

# Throwaway verification for the re-minted R2 token (secrets updated 2026-08-16
# 18:10Z). Exercises the three request shapes the real workflows need — HEAD
# (deploy.yml restore), single-part PUT, and multipart PUT (refresh-data upload,
# 603MB cache) — with the same env deploy.yml uses. Cleans up after itself.
# DELETE when done. [skip ci]

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: revealpoe2-cache
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: setup
        run: |
          aws --version
          head -c 1048576 /dev/zero > small.bin
          head -c 20971520 /dev/zero > multi.bin

      - name: "1) HEAD cache.tar.zst (deploy.yml restore path)"
        run: |
          if aws s3api head-object --bucket "$R2_BUCKET" --key "cache.tar.zst" --endpoint-url "$R2_ENDPOINT"; then
            echo "::notice::HEAD = PASS"
          else
            echo "::error::HEAD = FAIL"; exit 1
          fi

      - name: "2) single-part PUT (1 MiB)"
        run: |
          if aws s3api put-object --bucket "$R2_BUCKET" --key "_diag/small.bin" --body small.bin --endpoint-url "$R2_ENDPOINT" >/dev/null; then
            echo "::notice::PUT = PASS"
          else
            echo "::error::PUT = FAIL"; exit 1
          fi

      - name: "3) multipart PUT via aws s3 cp (20 MiB > 8 MiB threshold)"
        run: |
          if aws s3 cp multi.bin "s3://${R2_BUCKET}/_diag/multi.bin" --endpoint-url "$R2_ENDPOINT"; then
            echo "::notice::MULTIPART = PASS"
          else
            echo "::error::MULTIPART = FAIL"; exit 1
          fi

      - name: "cleanup probe objects"
        if: always()
        run: |
          aws s3 rm "s3://${R2_BUCKET}/_diag/" --recursive --endpoint-url "$R2_ENDPOINT" || true
