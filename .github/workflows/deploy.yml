name: Deploy (cached)

# Fast path: deploy on every push to main WITHOUT re-fetching game data.
#
# Restores the build cache (data/source + self-hosted art + OG cards) from R2,
# then runs the cache-aware build (`build:static:cached`, which OMITS the
# `fetch:tree` step — the only UNCONDITIONAL third-party fetch in the pipeline).
# Net third-party traffic on a code-only deploy is ~zero: `build:images`
# warm-skips when its referenced set is unchanged and every file is already on
# disk; genuinely-new art (a new item in the graph) pulls only that art.
#
# The cache is SEEDED and refreshed by refresh-data.yml. Run that workflow ONCE
# before the first deploy (and after each game patch) — until it has populated
# s3://revealpoe2-cache/cache.tar.zst this workflow fails fast with a hint.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_KEY: cache.tar.zst
  R2_BUCKET: revealpoe2-cache
  SITE_URL: https://revealpoe2.com
  # R2 is S3-compatible but rejects the default integrity checksums newer AWS
  # CLI versions send; only compute/validate them when the operation requires it.
  AWS_DEFAULT_REGION: auto
  AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
  AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Restore build cache from R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          if ! aws s3 cp "s3://${R2_BUCKET}/${CACHE_KEY}" "${CACHE_KEY}" --endpoint-url "$R2_ENDPOINT"; then
            echo "::error::No build cache in R2 (s3://${R2_BUCKET}/${CACHE_KEY})."
            echo "::error::Run the 'Refresh game data' workflow once to seed it, then re-run this deploy."
            exit 1
          fi
          tar --zstd -xf "${CACHE_KEY}"
          rm -f "${CACHE_KEY}"

      - name: Build static site (cache-aware, no upstream tree fetch)
        run: npm run build:static:cached

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --branch main
