name: TEST r2 upload (throwaway)

# Throwaway diagnostic — capture R2's RAW response + the signed request for a
# failing PUT vs a working GET, to pinpoint why writes get SignatureDoesNotMatch
# while reads succeed with the same keys. No credential changes. DELETE when done.

on:
  workflow_dispatch:

env:
  R2_BUCKET: revealpoe2-cache
  AWS_DEFAULT_REGION: auto

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: aws version + tiny dummy
        run: |
          aws --version
          head -c 1048576 /dev/zero > dummy.bin

      - name: "PUT (fails) — capture signed request + R2 response"
        continue-on-error: true
        run: |
          set -x
          aws s3api put-object --bucket "$R2_BUCKET" --key "_diag/probe.bin" \
            --body dummy.bin --endpoint-url "$R2_ENDPOINT" --debug 2> put.log || true
          echo "=================== PUT: SignedHeaders ==================="
          grep -aoE "SignedHeaders=[^,]+" put.log | tail -1
          echo "=================== PUT: CanonicalRequest ==================="
          awk '/CanonicalRequest:/{f=1} f{print} /StringToSign:/{if(f>1)exit; f++}' put.log | sed -n '1,40p'
          echo "=================== PUT: R2 response status + body ==================="
          grep -aiE "Response headers|https_response|<Code>|<Message>|x-amz-|cf-ray|Signature|StringToSign we|expecting|status_code" put.log | tail -40

      - name: "GET (works) — capture signed request for comparison"
        continue-on-error: true
        run: |
          set -x
          aws s3api head-object --bucket "$R2_BUCKET" --key "cache.tar.zst" \
            --endpoint-url "$R2_ENDPOINT" --debug 2> get.log || true
          echo "=================== GET: SignedHeaders ==================="
          grep -aoE "SignedHeaders=[^,]+" get.log | tail -1
          echo "=================== GET: status ==================="
          grep -aiE "https_response|status_code" get.log | tail -5
